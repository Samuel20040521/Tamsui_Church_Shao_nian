{% extends "base.html" %}

{% block content %}
<div class="p-4 space-y-6">
  <h1 class="text-2xl font-bold text-gray-800">每日靈修</h1>
  <p class="text-sm text-gray-500">{{ devotion.date }}</p>

  <!-- YouTube 影片區 (16:9 placeholder) -->
  <div class="bg-white rounded-xl shadow-md overflow-hidden">
    <div class="aspect-video bg-gradient-to-br from-red-500 to-pink-500 flex items-center justify-center">
      <div class="text-white text-center p-6">
        <svg class="w-20 h-20 mx-auto mb-3 opacity-90" fill="currentColor" viewBox="0 0 24 24">
          <path
            d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
        </svg>
        <h3 class="font-bold text-lg mb-2">{{ devotion.video_title }}</h3>
        <p class="text-sm opacity-80">YouTube 影片將在此顯示</p>
      </div>
    </div>
  </div>

  <!-- 本日金句 -->
  <div class="bg-gradient-to-r from-blue-50 to-indigo-50 border-l-4 border-blue-500 rounded-xl p-6 shadow-sm">
    <h3 class="font-semibold text-blue-900 mb-3 text-sm uppercase tracking-wide">本日金句</h3>
    <p class="text-lg text-gray-800 italic leading-relaxed mb-3">
      「{{ devotion.verse.text }}」
    </p>
    <p class="text-sm text-gray-600 text-right font-medium">
      — {{ devotion.verse.reference }}
    </p>
  </div>

  <!-- 靈修筆記 -->
  <div class="bg-white rounded-xl shadow-md p-6">
    <h3 class="font-bold text-lg text-gray-800 mb-4">我的靈修筆記</h3>
    <form>
      <textarea name="content" placeholder="記錄你的靈修心得、感動或領受..."
        class="w-full h-40 p-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none">{{ devotion.user_note }}</textarea>
      <button type="button"
        class="mt-4 w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-sm">
        儲存筆記
      </button>
    </form>
  </div>
</div>
{% endblock %}
