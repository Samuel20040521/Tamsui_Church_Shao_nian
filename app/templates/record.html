{% extends "base.html" %}

{% block content %}
<div class="p-4 space-y-4">
  <h1 class="text-2xl font-bold text-gray-800 mb-4">聚會紀錄</h1>

  <!-- 紀錄卡片列表 -->
  <div class="space-y-4">
    {% for record in records %}
    <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition cursor-pointer">
      <!-- Placeholder image -->
      {% if record.image_placeholder %}
      <div class="w-full h-48 bg-gradient-to-br from-blue-400 to-purple-500 flex items-center justify-center">
        <div class="text-white text-center">
          <svg class="w-16 h-16 mx-auto mb-2 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z">
            </path>
          </svg>
          <p class="text-sm opacity-75">聚會照片</p>
        </div>
      </div>
      {% endif %}

      <div class="p-4">
        <h3 class="font-bold text-lg text-gray-800 mb-1">{{ record.title }}</h3>
        <p class="text-sm text-gray-500">{{ record.date }}</p>
      </div>
    </div>
    {% else %}
    <div class="text-center py-12">
      <p class="text-gray-400">尚無聚會紀錄</p>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
