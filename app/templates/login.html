{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-b from-blue-50 to-white py-10">
  <div class="w-full max-w-md bg-white shadow-lg rounded-2xl p-6">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800">淡水教會少年聚會系統</h1>
      <p class="text-sm text-gray-500 mt-2">請使用帳號密碼或 Google 登入</p>
    </div>

    {% if error %}
    <div class="mb-4 p-3 rounded-lg bg-red-50 text-red-700 text-sm border border-red-100">
      {{ error }}
    </div>
    {% endif %}

    <form action="/login" method="post" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="email">電子郵件</label>
        <input id="email" name="email" type="email" required
          class="w-full rounded-lg border-gray-300 focus:border-blue-500 focus:ring-blue-500"
          placeholder="you@example.com">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="password">密碼</label>
        <input id="password" name="password" type="password" required
          class="w-full rounded-lg border-gray-300 focus:border-blue-500 focus:ring-blue-500" placeholder="請輸入密碼">
      </div>
      <button type="submit"
        class="w-full py-2.5 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-700 transition">
        以帳號密碼登入
      </button>
    </form>

    <div class="my-4 flex items-center gap-3">
      <div class="flex-1 h-px bg-gray-200"></div>
      <span class="text-xs text-gray-400">或</span>
      <div class="flex-1 h-px bg-gray-200"></div>
    </div>

    <a href="/auth/google"
      class="w-full inline-flex items-center justify-center gap-3 py-2.5 rounded-lg border border-gray-300 hover:bg-gray-50 transition text-gray-700 font-semibold">
      <svg class="w-5 h-5" viewBox="0 0 533.5 544.3" xmlns="http://www.w3.org/2000/svg">
        <path fill="#4285f4"
          d="M533.5 278.4c0-17.4-1.4-34-4.1-50.1H272v95h147.2c-6.3 33.7-25.1 62.3-53.4 81.6v67h86.4c50.5-46.5 80.3-115.1 80.3-193.5z" />
        <path fill="#34a853"
          d="M272 544.3c72.6 0 133.6-24 178.1-65.2l-86.4-67c-24 16.1-54.8 25.7-91.7 25.7-70.6 0-130.4-47.6-151.8-111.5H31v69.8C75.8 486.3 167.3 544.3 272 544.3z" />
        <path fill="#fbbc04" d="M120.2 326.3c-10.2-30.1-10.2-62.6 0-92.7V163.8H31c-27.3 54.6-27.3 119.2 0 173.8z" />
        <path fill="#ea4335"
          d="M272 107.7c39.5-.6 77.4 14 106.3 40.9l79.2-79.2C405.5 24.5 339.5-.5 272 0 167.3 0 75.8 58 31 163.8l89.2 69.8C141.6 155.4 201.4 107.8 272 107.7z" />
      </svg>
      使用 Google 登入
    </a>

    <p class="text-xs text-gray-400 text-center mt-4">僅限已建立帳號的成員可登入系統</p>
  </div>
</div>
{% endblock %}
