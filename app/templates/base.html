<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>淡水教會少年聚會系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="bg-gray-50">
  <div id="app" class="min-h-screen {% if hide_nav %}pb-0{% else %}pb-20{% endif %}">
    <!-- 主要內容區 -->
    <div class="max-w-md mx-auto">
      {% block content %}
      <!-- Page content goes here -->
      {% endblock %}
    </div>

    <!-- 底部導覽列 -->
    {% if not hide_nav %}
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg z-50">
      <div class="flex justify-around max-w-md mx-auto">
        <a href="/"
          class="flex flex-col items-center py-3 px-6 {% if active_tab == 'home' %}text-blue-600{% else %}text-gray-600 hover:text-blue-600{% endif %}">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
            </path>
          </svg>
          <span class="text-xs mt-1">主頁</span>
        </a>

        <a href="/record"
          class="flex flex-col items-center py-3 px-6 {% if active_tab == 'record' %}text-blue-600{% else %}text-gray-600 hover:text-blue-600{% endif %}">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01">
            </path>
          </svg>
          <span class="text-xs mt-1">紀錄</span>
        </a>

        <a href="/devotion"
          class="flex flex-col items-center py-3 px-6 {% if active_tab == 'devotion' %}text-blue-600{% else %}text-gray-600 hover:text-blue-600{% endif %}">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253">
            </path>
          </svg>
          <span class="text-xs mt-1">靈修</span>
        </a>

        <a href="/profile"
          class="flex flex-col items-center py-3 px-6 {% if active_tab == 'profile' %}text-blue-600{% else %}text-gray-600 hover:text-blue-600{% endif %}">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
          <span class="text-xs mt-1">個人</span>
        </a>
      </div>
    </nav>
    {% endif %}
  </div>

  <script src="/static/js/main.js"></script>
</body>

</html>
