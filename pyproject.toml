[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tamsui-church-shao-nian"
version = "0.1.0"
description = "淡水教會少年聚會系統"
authors = [
  { name = "Samuel" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.109.0",
  "uvicorn[standard]==0.27.0",
  "jinja2==3.1.2",
  "sqlalchemy==2.0.23",
  "pydantic==2.5.3",
  "python-multipart==0.0.6",
  "python-dotenv==1.0.0",
  "passlib[bcrypt]==1.7.4",
  "itsdangerous==2.1.2",
]

[project.optional-dependencies]
database = ["psycopg2-binary==2.9.9"]
migrations = ["alembic==1.13.0"]
hardware = [
  "nfcpy==1.0.3",
]
qrcode = [
  "qrcode==7.4.2",
  "pillow==10.1.0",
]
youtube = [
  "google-auth-oauthlib==1.2.0",
  "google-auth-httplib2==0.2.0",
  "google-api-python-client==2.108.0",
]
test = [
  "pytest==7.4.3",
  "pytest-cov==4.1.0",
  "httpx==0.25.2",
]
dev = [
  "black==23.12.1",
  "flake8==6.1.0",
  "mypy==1.7.1",
]

[tool.uv]
development-dependencies = ["pytest", "pytest-cov", "httpx", "black", "flake8", "mypy"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
